<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reserve a table</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<main class="container py-4">
 <h1 class="h3 mb-3">Reserve a table</h1>
 <form class="row g-3" action="#" method="post">
  <div class="col-md-6"><label class="form-label" for="name">Your name</label>
   <input class="form-control" type="text" id="name" name="name" autocomplete="name" required></div>
  <div class="col-md-6"><label class="form-label" for="email">Email</label>
   <input class="form-control" type="email" id="email" name="email" autocomplete="email" required></div>
  <div class="col-md-6"><label class="form-label" for="phone">Phone</label>
   <input class="form-control" type="tel" id="phone" name="phone" autocomplete="tel" required></div>
  <div class="col-md-6"><label class="form-label" for="guests">Guests</label>
   <input class="form-control" type="number" id="guests" name="guests" min="1" max="20" required></div>
  <div class="col-md-6"><label class="form-label" for="date">Date</label>
   <input class="form-control" type="date" id="date" name="date" required></div>
  <div class="col-md-6"><label class="form-label" for="meal">Meal</label>
   <select class="form-select" id="meal" name="meal">
    <option value="lunch">Lunch</option><option value="dinner">Dinner</option>
   </select></div>
  <fieldset class="col-12">
   <legend class="form-label">Seating</legend>
   <div class="form-check form-check-inline"><input class="form-check-input" type="radio" name="seating" id="inside" value="inside" required><label class="form-check-label" for="inside">Inside</label></div>
   <div class="form-check form-check-inline"><input class="form-check-input" type="radio" name="seating" id="terrace" value="terrace" required><label class="form-check-label" for="terrace">Terrace</label></div>
  </fieldset>
  <div class="col-12"><label class="form-label" for="comments">Comments</label>
   <textarea class="form-control" id="comments" name="comments" rows="3"></textarea></div>
  <div class="col-12"><div class="form-check">
   <input class="form-check-input" type="checkbox" id="terms" name="terms" required>
   <label class="form-check-label" for="terms">I agree to the terms</label></div></div>
  <div class="col-12"><button class="btn btn-primary" type="submit">Reserve</button></div>
 </form>
</main>
</body>
</html>
